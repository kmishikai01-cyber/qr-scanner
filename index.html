<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>産業医研修会 QR受付スキャナー</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #1e293b;
      color: #ffffff;
      text-align: center;
    }
    .header {
      background-color: #0f172a;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .header-title { font-weight: bold; font-size: 15px; }
    .sync-badge {
      background-color: #334155;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      color: #94a3b8;
    }
    .sync-badge.ready { color: #4ade80; }

    /* パスコード認証画面 */
    #auth-area {
      max-width: 400px;
      margin: 40px auto;
      padding: 25px 20px;
      background-color: #0f172a;
      border-radius: 12px;
    }
    .auth-input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      text-align: center;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #ffffff;
      margin-bottom: 15px;
    }

    /* モード切替スイッチ */
    .mode-switch-bar {
      max-width: 480px;
      margin: 12px auto;
      padding: 0 15px;
      display: none;
      gap: 10px;
    }
    .mode-btn {
      flex: 1;
      padding: 14px 10px;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid #475569;
      border-radius: 10px;
      background-color: #0f172a;
      color: #94a3b8;
      cursor: pointer;
    }
    .mode-btn.active-in {
      background-color: #16a34a;
      border-color: #4ade80;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(22, 163, 74, 0.5);
    }
    .mode-btn.active-out {
      background-color: #2563eb;
      border-color: #60a5fa;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.5);
    }

    .camera-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #000;
    }
    #reader {
      width: 100%;
    }
    #reader video {
      width: 100% !important;
      height: auto !important;
      object-fit: cover;
    }

    #start-area {
      padding: 40px 20px;
      display: none;
    }
    .btn-start {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 18px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      width: 90%;
      max-width: 340px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }
    .btn-start:disabled {
      background-color: #64748b;
      box-shadow: none;
    }

    .result-panel {
      max-width: 480px;
      margin: 15px auto;
      padding: 20px 15px;
      border-radius: 12px;
      background-color: #334155;
      min-height: 130px;
      display: none;
      flex-direction: column;
      justify-content: center;
      transition: background-color 0.15s;
    }
    .result-panel.status-success { background-color: #16a34a; }
    .result-panel.status-exit    { background-color: #2563eb; }
    .result-panel.status-already { background-color: #d97706; }
    .result-panel.status-error   { background-color: #dc2626; }

    .res-title { font-size: 22px; font-weight: bold; margin: 0 0 8px 0; }
    .res-name  { font-size: 26px; font-weight: bold; margin: 0; }
    .res-sub   { font-size: 14px; margin: 6px 0 0 0; opacity: 0.9; }

    .history-box {
      max-width: 480px;
      margin: 15px auto 30px auto;
      padding: 0 15px;
      text-align: left;
      display: none;
    }
    .history-title { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 13px;
    }
    .history-list li {
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">📷 産業医研修会 QR受付</div>
    <div class="sync-badge" id="sync-status">認証待ち</div>
  </div>

  <!-- パスコード認証エリア -->
  <div id="auth-area">
    <h3 style="margin-top:0;">🔒 受付スタッフ認証</h3>
    <p style="font-size:13px; color:#cbd5e1; margin-bottom:15px;">受付パスコードを入力してください</p>
    <input type="password" id="passcode-input" class="auth-input" placeholder="パスコードを入力">
    <button class="btn-start" style="width:100%;" onclick="verifyPasscode()">認証してデータ読込</button>
    <p id="auth-error" style="color:#f87171; font-size:13px; margin-top:12px; display:none;">パスコードが正しくありません</p>
  </div>

  <!-- モード切替スイッチ -->
  <div class="mode-switch-bar" id="mode-bar">
    <button id="btn-mode-in" class="mode-btn active-in" onclick="setMode('in')">🟢 入室受付モード</button>
    <button id="btn-mode-out" class="mode-btn" onclick="setMode('out')">🔵 退室受付モード</button>
  </div>

  <div id="start-area">
    <p style="color: #cbd5e1; font-size: 14px; margin-bottom: 20px;">
      下のボタンを押してカメラと通知音を有効にしてください
    </p>
    <button id="btn-start" class="btn-start" onclick="startScanner()" disabled>データ読込中...</button>
  </div>

  <div class="camera-wrapper">
    <div id="reader"></div>
  </div>

  <div id="result-panel" class="result-panel">
    <p class="res-title" id="res-title">QRコードをかざしてください</p>
    <p class="res-name" id="res-name"></p>
    <p class="res-sub" id="res-sub">現在のモード：入室受付</p>
  </div>

  <div id="history-box" class="history-box">
    <div class="history-title">直近のスキャン履歴</div>
    <ul id="history-list" class="history-list"></ul>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwEE1T7AI-z1ZlBNPUE3B5tQuPqno7bl-P4CLc8zeJWKYP8jFx9A9uV8ZxA4f3-H-rY/exec";

    let savedKey = localStorage.getItem("qr_scanner_key") || "";
    let masterData = [];
    let audioCtx = null;
    let html5QrCode = null;
    let lastScannedText = "";
    let lastScannedTime = 0;
    let pendingSaves = 0;
    let currentMode = "in";

    window.onload = function() {
      if (savedKey) {
        fetchMasterData(true);
      }
      setInterval(() => {
        if (savedKey) fetchMasterData(false);
      }, 20000);
    };

    function verifyPasscode() {
      const input = document.getElementById("passcode-input").value.trim();
      if (!input) return;
      savedKey = input;
      document.getElementById("auth-error").style.display = "none";
      fetchMasterData(true);
    }

    function fetchMasterData(isInitial) {
      if (pendingSaves > 0 || !savedKey) return;
      
      fetch(`${GAS_API_URL}?api=getData&key=${encodeURIComponent(savedKey)}`)
        .then(response => response.json())
        .then(res => {
          if (res.error === "unauthorized") {
            localStorage.removeItem("qr_scanner_key");
            savedKey = "";
            document.getElementById("auth-area").style.display = "block";
            document.getElementById("start-area").style.display = "none";
            document.getElementById("mode-bar").style.display = "none";
            document.getElementById("auth-error").style.display = "block";
            document.getElementById("sync-status").innerText = "認証エラー";
            return;
          }

          if (pendingSaves === 0 && res.rows) {
            localStorage.setItem("qr_scanner_key", savedKey);
            masterData = res.rows;
            const badge = document.getElementById("sync-status");
            badge.innerText = `同期済 (${masterData.length}名)`;
            badge.classList.add("ready");

            if (isInitial) {
              document.getElementById("auth-area").style.display = "none";
              document.getElementById("mode-bar").style.display = "flex";
              document.getElementById("start-area").style.display = "block";
              const btn = document.getElementById("btn-start");
              btn.disabled = false;
              btn.innerText = "📷 カメラを起動して受付開始";
            }
          }
        })
        .catch(err => {
          console.error(err);
          if (isInitial) {
            document.getElementById("sync-status").innerText = "読込エラー";
          }
        });
    }

    function setMode(mode) {
      if (mode === "out" && currentMode !== "out") {
        if (!confirm("【確認】「退室受付モード」に切り替えますか？\n※これ以降スキャンした方は退室時刻が記録されます。")) {
          return;
        }
      }
      currentMode = mode;
      const btnIn = document.getElementById("btn-mode-in");
      const btnOut = document.getElementById("btn-mode-out");

      if (mode === "in") {
        btnIn.className = "mode-btn active-in";
        btnOut.className = "mode-btn";
        showResult("default", "🟢 入室受付モード", "", "受講票のQRコードをかざしてください");
      } else {
        btnIn.className = "mode-btn";
        btnOut.className = "mode-btn active-out";
        showResult("default", "🔵 退室受付モード", "", "お帰りの受講票QRコードをかざしてください");
      }
    }

    function startScanner() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass && !audioCtx) {
        audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }

      document.getElementById("start-area").style.display = "none";
      document.getElementById("result-panel").style.display = "flex";
      document.getElementById("history-box").style.display = "block";
      document.getElementById("reader").style.minHeight = "300px";

      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 230, height: 230 } },
        onScanSuccess
      ).catch(err => {
        document.getElementById("start-area").style.display = "block";
        document.getElementById("result-panel").style.display = "none";
        document.getElementById("history-box").style.display = "none";
        document.getElementById("reader").style.minHeight = "0";
        alert("カメラの起動に失敗しました。許可設定を確認してください。\n" + err);
      });
    }

    function onScanSuccess(decodedText) {
      const nowMs = Date.now();
      if (decodedText === lastScannedText && (nowMs - lastScannedTime) < 3500) {
        return;
      }
      lastScannedText = decodedText;
      lastScannedTime = nowMs;

      let receiptId = decodedText.trim();
      if (receiptId.includes("id=")) {
        try {
          const urlObj = new URL(receiptId);
          receiptId = urlObj.searchParams.get("id") || receiptId;
        } catch (e) {
          const match = receiptId.match(/[?&]id=([^&]+)/);
          if (match) receiptId = decodeURIComponent(match[1]);
        }
      }

      processLocalAndSave(receiptId);
    }

    function processLocalAndSave(id) {
      const targetRow = masterData.find(r => String(r["受付番号"]).trim() === id);
      
      if (!targetRow) {
        showResult("error", "❌ データが見つかりません", `ID: ${id}`, "受講票のQRコードかご確認ください");
        playBeep("error");
        return;
      }

      const name = targetRow["１．氏 名"] || "受講者";
      const isAttended = targetRow["出席"] === "出席";
      const hasExited = Boolean(targetRow["退室時刻"]);

      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2, '0') + ':' +
                      now.getMinutes().toString().padStart(2, '0') + ':' +
                      now.getSeconds().toString().padStart(2, '0');

      if (currentMode === "in") {
        if (isAttended) {
          showResult("already", "⚠️ すでに入室済みです", `${name} 先生`, `入室時刻：${targetRow["確認時刻"] || "記録済"}`);
          playBeep("already");
          addHistory(name, "重複読込(入室済)", timeStr);
          return;
        }

        targetRow["出席"] = "出席";
        targetRow["確認時刻"] = timeStr;
        showResult("success", "✅ 入室受付完了", `${name} 先生`, `受付時刻：${timeStr}`);
        playBeep("success");
        addHistory(name, "入室受付", timeStr);
        sendToServer(id, name, "in");
        return;
      }

      if (currentMode === "out") {
        if (!isAttended) {
          showResult("error", "❌ 入室記録がありません", `${name} 先生`, "先に入室受付を行ってください");
          playBeep("error");
          addHistory(name, "エラー(未入室)", timeStr);
          return;
        }
        if (hasExited) {
          showResult("already", "⚠️ すでに退室済みです", `${name} 先生`, `退室時刻：${targetRow["退室時刻"]}`);
          playBeep("already");
          addHistory(name, "重複読込(退室済)", timeStr);
          return;
        }

        targetRow["退室時刻"] = timeStr;
        showResult("exit", "✅ 退室記録完了", `${name} 先生`, `お疲れ様でした（${timeStr}）`);
        playBeep("exit_success");
        addHistory(name, "退室記録", timeStr);
        sendToServer(id, name, "out");
        return;
      }
    }

    function sendToServer(id, name, mode) {
      pendingSaves++;
      
      fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ key: savedKey, action: "checkin", id: id, mode: mode })
      })
      .then(response => response.json())
      .then(res => {
        pendingSaves--;
      })
      .catch(err => {
        pendingSaves--;
        alert(`【通信エラー】${name}先生の記録保存に失敗しました。電波状況を確認し、もう一度スキャンしてください。`);
      });
    }

    function showResult(status, title, name, sub) {
      const panel = document.getElementById("result-panel");
      panel.className = status === "default" ? "result-panel" : "result-panel status-" + status;
      document.getElementById("res-title").innerText = title;
      document.getElementById("res-name").innerText = name;
      document.getElementById("res-sub").innerText = sub;

      if (status !== "default" && navigator.vibrate) {
        navigator.vibrate(status === "success" || status === "exit" ? 100 : [100, 50, 100]);
      }
    }

    function addHistory(name, action, timeStr) {
      const list = document.getElementById("history-list");
      const li = document.createElement("li");
      li.innerHTML = `<span><b>${name}</b> 先生</span><span>${action} (${timeStr})</span>`;
      list.insertBefore(li, list.firstChild);
      if (list.children.length > 5) {
        list.removeChild(list.lastChild);
      }
    }

    function playTone(freq, type, startTime, duration, volume) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(volume, startTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    }

    function playBeep(status) {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;

      if (status === 'success') {
        playTone(880, 'sine', now, 0.4, 0.8);
      } else if (status === 'exit_success') {
        playTone(660, 'sine', now, 0.14, 0.8);
        playTone(880, 'sine', now + 0.15, 0.4, 0.8);
      } else {
        playTone(200, 'square', now, 0.18, 0.3);
        playTone(200, 'square', now + 0.22, 0.25, 0.3);
      }
    }
  </script>
</body>
</html>
